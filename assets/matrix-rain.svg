<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" role="img" aria-label="Aira Cyber Matrix Stream Console">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mx-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#050b18"/>
      <stop offset="100%" stop-color="#02050d"/>
    </linearGradient>

    <!-- Matrix Head Glow -->
    <filter id="mx-head-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="mx-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="30%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="mx-laser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="mx-clip">
      <rect width="1200" height="320" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .m-font { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    .head-cyan { fill: #ffffff; filter: url(#mx-head-glow); }
    .head-green { fill: #ffffff; filter: url(#mx-head-glow); }
    .mid-cyan { fill: #38bdf8; opacity: 0.85; }
    .mid-green { fill: #34d399; opacity: 0.85; }
    .tail-dark { fill: #064e3b; opacity: 0.35; }
    .tail-blue { fill: #0c4a6e; opacity: 0.35; }
  </style>

  <g clip-path="url(#mx-clip)">
    <!-- Container Box -->
    <rect width="1200" height="320" fill="url(#mx-bg)"/>
    <rect x="1" y="1" width="1198" height="318" rx="13" fill="none" stroke="url(#mx-border)" stroke-width="1.2"/>

    <!-- Window Header Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 1186 0 Q 1200 0 1200 14 L 1200 38 L 0 38 Z" fill="#080f1d"/>
    <line x1="0" y1="38" x2="1200" y2="38" stroke="#1e293b" stroke-width="1"/>

    <!-- Terminal Window Controls -->
    <circle cx="28" cy="19" r="5" fill="#ef4444" opacity="0.85"/>
    <circle cx="46" cy="19" r="5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="64" cy="19" r="5" fill="#10b981" opacity="0.85"/>

    <!-- Window Title -->
    <text x="600" y="23" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.5" class="m-font">
      aira@matrix-core <tspan fill="#475569">::</tspan> <tspan fill="#34d399">stream.daemon</tspan> <tspan fill="#475569">[</tspan><tspan fill="#38bdf8">0x7FA9</tspan><tspan fill="#475569">]</tspan>
    </text>

    <!-- Live Pulse Indicator Right -->
    <g transform="translate(1080, 19)">
      <circle cx="0" cy="0" r="3.5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="12" y="3.5" fill="#34d399" font-size="9" font-weight="700" class="m-font">STREAMING</text>
    </g>

    <!-- Top Scanning Laser with SMIL -->
    <g transform="translate(0, 37)">
      <rect y="0" width="240" height="2" fill="url(#mx-laser)">
        <animateTransform attributeName="transform" type="translate" values="-240 0; 1200 0" dur="4.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ================= MATRIX DIGITAL RAIN FALLING COLUMNS (SMIL NATIVE) ================= -->
    <g class="m-font">
      <!-- Col 1 -->
      <g transform="translate(50, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="4.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="4.2s" repeatCount="indefinite"/>
          <text y="0" class="tail-blue">01</text>
          <text y="18" class="tail-blue">&gt; sh</text>
          <text y="36" class="mid-cyan">λ_init</text>
          <text y="54" class="mid-cyan">0xFA</text>
          <text y="72" class="head-cyan">1</text>
        </g>
      </g>

      <!-- Col 2 -->
      <g transform="translate(110, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="5.6s" begin="-2.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="5.6s" begin="-2.3s" repeatCount="indefinite"/>
          <text y="0" class="tail-dark">01101</text>
          <text y="18" class="tail-dark">#next</text>
          <text y="36" class="mid-green">0x9B</text>
          <text y="54" class="mid-green">&lt;SYS&gt;</text>
          <text y="72" class="head-green">λ</text>
        </g>
      </g>

      <!-- Col 3 -->
      <g transform="translate(170, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="3.8s" begin="-1.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="3.8s" begin="-1.2s" repeatCount="indefinite"/>
          <text y="0" class="tail-blue">NET_OK</text>
          <text y="18" class="mid-cyan">1001</text>
          <text y="36" class="head-cyan">&gt;</text>
        </g>
      </g>

      <!-- Col 4 -->
      <g transform="translate(230, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="6.1s" begin="-3.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="6.1s" begin="-3.8s" repeatCount="indefinite"/>
          <text y="0" class="tail-dark">~//core</text>
          <text y="18" class="tail-dark">0101</text>
          <text y="36" class="mid-green">0x1C</text>
          <text y="54" class="mid-green">λ_exec</text>
          <text y="72" class="head-green">0</text>
        </g>
      </g>

      <!-- Col 5 -->
      <g transform="translate(290, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="4.6s" begin="-0.9s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="4.6s" begin="-0.9s" repeatCount="indefinite"/>
          <text y="0" class="tail-blue">11001</text>
          <text y="18" class="tail-blue">&gt; nest</text>
          <text y="36" class="mid-cyan">0x7F</text>
          <text y="54" class="head-cyan">1</text>
        </g>
      </g>

      <!-- Col 6 -->
      <g transform="translate(350, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="5.2s" begin="-2.7s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="5.2s" begin="-2.7s" repeatCount="indefinite"/>
          <text y="0" class="tail-dark">::pipe</text>
          <text y="18" class="tail-dark">1010</text>
          <text y="36" class="mid-green">0x4D</text>
          <text y="54" class="mid-green">[SYNC]</text>
          <text y="72" class="head-green">_</text>
        </g>
      </g>

      <!-- Col 7 -->
      <g transform="translate(420, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="4.1s" begin="-1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="4.1s" begin="-1.5s" repeatCount="indefinite"/>
          <text y="0" class="tail-blue">0xAA</text>
          <text y="18" class="mid-cyan">0111</text>
          <text y="36" class="head-cyan">&gt;</text>
        </g>
      </g>

      <!-- Col 8 -->
      <g transform="translate(490, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="5.9s" begin="-4.1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="5.9s" begin="-4.1s" repeatCount="indefinite"/>
          <text y="0" class="tail-dark">SYS_200</text>
          <text y="18" class="tail-dark">10010</text>
          <text y="36" class="mid-green">0x3B</text>
          <text y="54" class="mid-green">λ=&gt;run</text>
          <text y="72" class="head-green">1</text>
        </g>
      </g>

      <!-- Col 9 -->
      <g transform="translate(560, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="3.9s" begin="-0.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="3.9s" begin="-0.4s" repeatCount="indefinite"/>
          <text y="0" class="tail-blue">0101</text>
          <text y="18" class="mid-cyan">0x07D</text>
          <text y="36" class="head-cyan">0</text>
        </g>
      </g>

      <!-- Col 10 -->
      <g transform="translate(630, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="6.4s" begin="-3.1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="6.4s" begin="-3.1s" repeatCount="indefinite"/>
          <text y="0" class="tail-dark">~dock</text>
          <text y="18" class="tail-dark">1110</text>
          <text y="36" class="mid-green">0x88</text>
          <text y="54" class="head-green">λ</text>
        </g>
      </g>

      <!-- Col 11 -->
      <g transform="translate(700, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="4.5s" begin="-1.9s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="4.5s" begin="-1.9s" repeatCount="indefinite"/>
          <text y="0" class="tail-blue">0x99</text>
          <text y="18" class="tail-blue">::redis</text>
          <text y="36" class="mid-cyan">10111</text>
          <text y="54" class="head-cyan">1</text>
        </g>
      </g>

      <!-- Col 12 -->
      <g transform="translate(770, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="5.7s" begin="-2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="5.7s" begin="-2.4s" repeatCount="indefinite"/>
          <text y="0" class="tail-dark">0100</text>
          <text y="18" class="tail-dark">#prisma</text>
          <text y="36" class="mid-green">0x2A</text>
          <text y="54" class="mid-green">&gt; api</text>
          <text y="72" class="head-green">&gt;</text>
        </g>
      </g>

      <!-- Col 13 -->
      <g transform="translate(840, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="4.0s" begin="-0.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="4.0s" begin="-0.8s" repeatCount="indefinite"/>
          <text y="0" class="tail-blue">1110</text>
          <text y="18" class="mid-cyan">0xFE</text>
          <text y="36" class="head-cyan">0</text>
        </g>
      </g>

      <!-- Col 14 -->
      <g transform="translate(910, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="6.3s" begin="-4.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="6.3s" begin="-4.5s" repeatCount="indefinite"/>
          <text y="0" class="tail-dark">sys::v2</text>
          <text y="18" class="tail-dark">10101</text>
          <text y="36" class="mid-green">0x0E</text>
          <text y="54" class="mid-green">λ_loop</text>
          <text y="72" class="head-green">1</text>
        </g>
      </g>

      <!-- Col 15 -->
      <g transform="translate(980, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="4.8s" begin="-1.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="4.8s" begin="-1.3s" repeatCount="indefinite"/>
          <text y="0" class="tail-blue">0x55</text>
          <text y="18" class="tail-blue">&gt; test</text>
          <text y="36" class="mid-cyan">0110</text>
          <text y="54" class="head-cyan">_</text>
        </g>
      </g>

      <!-- Col 16 -->
      <g transform="translate(1040, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="5.4s" begin="-2.9s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="5.4s" begin="-2.9s" repeatCount="indefinite"/>
          <text y="0" class="tail-dark">10001</text>
          <text y="18" class="tail-dark">::node</text>
          <text y="36" class="mid-green">0x7B</text>
          <text y="54" class="head-green">λ</text>
        </g>
      </g>

      <!-- Col 17 -->
      <g transform="translate(1100, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="4.9s" begin="-1.7s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="4.9s" begin="-1.7s" repeatCount="indefinite"/>
          <text y="0" class="tail-blue">0x33</text>
          <text y="18" class="tail-blue">10011</text>
          <text y="36" class="mid-cyan">0xEF</text>
          <text y="54" class="head-cyan">0</text>
        </g>
      </g>

      <!-- Col 18 -->
      <g transform="translate(1150, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -280; 0 350" dur="5.1s" begin="-2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.1;0.9;1" dur="5.1s" begin="-2.2s" repeatCount="indefinite"/>
          <text y="0" class="tail-dark">1110</text>
          <text y="18" class="mid-green">0x0A</text>
          <text y="36" class="head-green">&gt;</text>
        </g>
      </g>
    </g>

    <!-- Terminal Foreground Overlay HUD Box -->
    <g transform="translate(48, 170)">
      <!-- HUD Backdrop Filter Box -->
      <rect width="1104" height="124" rx="10" fill="#040814" fill-opacity="0.92" stroke="#1e293b" stroke-width="1.2"/>

      <!-- Terminal Command & Status Rows -->
      <g class="m-font" transform="translate(24, 28)">
        <!-- Line 1: Terminal Command with Blinking Cursor -->
        <text y="0" fill="#38bdf8" font-weight="700">
          aira@system<tspan fill="#64748b">:</tspan><tspan fill="#34d399">~/architecture</tspan><tspan fill="#64748b">$</tspan> <tspan fill="#f8fafc">./sys-health --verbose --realtime</tspan>
        </text>
        <rect x="424" y="-12" width="7.5" height="14" fill="#38bdf8">
          <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
        </rect>

        <!-- Line 2: Telemetry Parameters -->
        <g transform="translate(0, 26)" font-size="11">
          <text y="0" fill="#64748b">[ENGINE] <tspan fill="#f1f5f9" font-weight="600">TypeScript 5</tspan> <tspan fill="#475569">|</tspan> <tspan fill="#38bdf8" font-weight="600">Next.js 14</tspan> <tspan fill="#475569">|</tspan> <tspan fill="#818cf8" font-weight="600">NestJS</tspan> <tspan fill="#475569">|</tspan> <tspan fill="#34d399" font-weight="600">Postgres + Redis</tspan></text>
        </g>

        <!-- Line 3: System Pipeline Status -->
        <g transform="translate(0, 50)" font-size="11">
          <text y="0" fill="#64748b">[STATUS] <tspan fill="#34d399" font-weight="700">OPERATIONAL 100%</tspan> <tspan fill="#475569">|</tspan> [CONTAINERS] <tspan fill="#38bdf8" font-weight="600">DOCKER ENGINE UP</tspan> <tspan fill="#475569">|</tspan> [FLOW] <tspan fill="#c084fc" font-weight="600">GHA CI/CD GREEN</tspan></text>
        </g>

        <!-- Line 4: Terminal Slogan Tag -->
        <g transform="translate(0, 74)" font-size="10.5">
          <text y="0" fill="#475569">&gt;&gt; PHILOSOPHY: <tspan fill="#22d3ee" font-weight="700">Build clean. Ship fast. Automate continuously.</tspan></text>
        </g>
      </g>
    </g>
  </g>
</svg>
