<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" role="img" aria-label="Aira - Full-Stack Developer &amp; System Builder">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#070e1c"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>

    <!-- Core Ambient Glow -->
    <radialGradient id="hero-core-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.14"/>
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>

    <!-- Frame Border Gradient -->
    <linearGradient id="hero-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Title Glow Gradient -->
    <linearGradient id="hero-title-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Scanline Laser Gradient -->
    <linearGradient id="hero-laser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Matrix Glow Filter -->
    <filter id="matrix-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="core-soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <!-- Subtle Cyber Background Grid -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="40" cy="40" r="0.8" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <clipPath id="hero-clip">
      <rect width="1200" height="420" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; }
    .m-head { fill: #ffffff; font-weight: 800; filter: url(#matrix-glow); }
    .m-mid { fill: #22d3ee; opacity: 0.75; }
    .m-fade { fill: #0e7490; opacity: 0.35; }
  </style>

  <!-- Group with ClipPath -->
  <g clip-path="url(#hero-clip)">
    <!-- Base Outer Container -->
    <rect width="1200" height="420" fill="url(#hero-bg)"/>
    <rect width="1200" height="420" fill="url(#cyber-grid)"/>

    <!-- Matrix Digital Rain Stream Layer (SMIL Animation: Reliable in all image contexts) -->
    <g class="mono" font-size="11" opacity="0.35" letter-spacing="1">
      <!-- Col 1 -->
      <g transform="translate(60, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -360; 0 440" dur="4.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="4.8s" repeatCount="indefinite"/>
          <text y="0" class="m-fade">0x1F</text>
          <text y="20" class="m-fade">&gt; sys</text>
          <text y="40" class="m-mid">λ_init</text>
          <text y="60" class="m-mid">10110</text>
          <text y="80" class="m-mid">[OK]</text>
          <text y="100" class="m-head">&gt;_</text>
        </g>
      </g>

      <!-- Col 2 -->
      <g transform="translate(130, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -360; 0 440" dur="6.2s" begin="-3.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="6.2s" begin="-3.4s" repeatCount="indefinite"/>
          <text y="0" class="m-fade">01001</text>
          <text y="20" class="m-fade">::pipe</text>
          <text y="40" class="m-mid">0x8B</text>
          <text y="60" class="m-mid">&lt;STREAM&gt;</text>
          <text y="80" class="m-head">1</text>
        </g>
      </g>

      <!-- Col 3 -->
      <g transform="translate(210, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -360; 0 440" dur="5.1s" begin="-0.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="5.1s" begin="-0.5s" repeatCount="indefinite"/>
          <text y="0" class="m-fade">NET_200</text>
          <text y="20" class="m-fade">#nest</text>
          <text y="40" class="m-mid">0xFA4</text>
          <text y="60" class="m-mid">λ=&gt;run</text>
          <text y="80" class="m-mid">0011</text>
          <text y="100" class="m-head">0</text>
        </g>
      </g>

      <!-- Col 4 -->
      <g transform="translate(290, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -360; 0 440" dur="7.0s" begin="-4.1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="7.0s" begin="-4.1s" repeatCount="indefinite"/>
          <text y="0" class="m-fade">~//core</text>
          <text y="20" class="m-mid">0x07D</text>
          <text y="40" class="m-mid">1101</text>
          <text y="60" class="m-head">λ</text>
        </g>
      </g>

      <!-- Col 5 -->
      <g transform="translate(370, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -360; 0 440" dur="5.6s" begin="-2.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="5.6s" begin="-2.3s" repeatCount="indefinite"/>
          <text y="0" class="m-fade">0110</text>
          <text y="20" class="m-fade">&gt;_node</text>
          <text y="40" class="m-mid">0x3A</text>
          <text y="60" class="m-head">1</text>
        </g>
      </g>

      <!-- Col 6 -->
      <g transform="translate(830, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -360; 0 440" dur="5.9s" begin="-1.7s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="5.9s" begin="-1.7s" repeatCount="indefinite"/>
          <text y="0" class="m-fade">1001</text>
          <text y="20" class="m-mid">0x4D</text>
          <text y="40" class="m-mid">ci/cd</text>
          <text y="60" class="m-head">&gt;</text>
        </g>
      </g>

      <!-- Col 7 -->
      <g transform="translate(910, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -360; 0 440" dur="4.4s" begin="-0.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="4.4s" begin="-0.8s" repeatCount="indefinite"/>
          <text y="0" class="m-fade">0x99</text>
          <text y="20" class="m-fade">~dock</text>
          <text y="40" class="m-mid">11100</text>
          <text y="60" class="m-mid">[SYNC]</text>
          <text y="80" class="m-head">0</text>
        </g>
      </g>

      <!-- Col 8 -->
      <g transform="translate(990, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -360; 0 440" dur="6.5s" begin="-3.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="6.5s" begin="-3.8s" repeatCount="indefinite"/>
          <text y="0" class="m-fade">sys::v2</text>
          <text y="20" class="m-fade">01011</text>
          <text y="40" class="m-mid">0x2E</text>
          <text y="60" class="m-mid">λ_exec</text>
          <text y="80" class="m-head">1</text>
        </g>
      </g>

      <!-- Col 9 -->
      <g transform="translate(1060, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -360; 0 440" dur="5.2s" begin="-2.1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="5.2s" begin="-2.1s" repeatCount="indefinite"/>
          <text y="0" class="m-fade">0xAA</text>
          <text y="20" class="m-mid">10101</text>
          <text y="40" class="m-mid">&gt; sh</text>
          <text y="60" class="m-head">_</text>
        </g>
      </g>

      <!-- Col 10 -->
      <g transform="translate(1130, 0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -360; 0 440" dur="6.0s" begin="-4.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="6.0s" begin="-4.8s" repeatCount="indefinite"/>
          <text y="0" class="m-fade">10001</text>
          <text y="20" class="m-mid">0x0F</text>
          <text y="40" class="m-head">&gt;</text>
        </g>
      </g>
    </g>

    <!-- Ambient Radiant Core Glow -->
    <circle cx="600" cy="180" r="320" fill="url(#hero-core-glow)" filter="url(#core-soft-blur)"/>

    <!-- Orbital Ellipse Rings (Matching Image 2 Aesthetic) -->
    <g fill="none" stroke-linecap="round">
      <ellipse cx="600" cy="180" rx="360" ry="145" stroke="#38bdf8" stroke-opacity="0.22" stroke-dasharray="8 6" transform="rotate(-6 600 180)"/>
      <ellipse cx="600" cy="180" rx="330" ry="130" stroke="#818cf8" stroke-opacity="0.18" stroke-dasharray="4 8" transform="rotate(8 600 180)"/>
      <circle cx="600" cy="180" r="190" stroke="#0ea5e9" stroke-opacity="0.12" stroke-width="1.2"/>
    </g>

    <!-- Orbital Telemetry Labels & Nodes (Matching Image 2) -->
    <g class="mono" font-size="10.5" fill="#64748b" font-weight="600" letter-spacing="1.5">
      <text x="100" y="80">01</text>
      <text x="210" y="118">API</text>
      <circle cx="200" cy="115" r="2.5" fill="#38bdf8" opacity="0.6"/>

      <text x="135" y="280">NEXT</text>
      <text x="965" y="80">CI/CD</text>

      <text x="935" y="145">DOCKER</text>
      <circle cx="995" cy="142" r="2.5" fill="#818cf8" opacity="0.6"/>

      <text x="980" y="275">NEST</text>
    </g>

    <!-- Top System Header Bar (Terminal / Node Diagnostics) -->
    <g transform="translate(48, 28)">
      <circle cx="0" cy="0" r="4.5" fill="#ef4444" opacity="0.85"/>
      <circle cx="16" cy="0" r="4.5" fill="#f59e0b" opacity="0.85"/>
      <circle cx="32" cy="0" r="4.5" fill="#10b981" opacity="0.85"/>

      <text x="56" y="4" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5" class="mono">
        imaira203 <tspan fill="#475569">/</tspan> <tspan fill="#38bdf8">README.md</tspan> <tspan fill="#475569">::</tspan> <tspan fill="#64748b">PROFILE.SYS</tspan>
      </text>

      <g transform="translate(860, -11)">
        <rect width="90" height="22" rx="4" fill="#081020" stroke="#1e293b"/>
        <circle cx="12" cy="11" r="3.5" fill="#10b981">
          <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="24" y="15" fill="#34d399" font-size="9" font-weight="700" class="mono">ONLINE</text>

        <rect x="100" y="0" width="144" height="22" rx="4" fill="#081020" stroke="#1e293b"/>
        <text x="110" y="15" fill="#94a3b8" font-size="9" class="mono">SYS: <tspan fill="#38bdf8">imaira203</tspan></text>
      </g>
    </g>

    <!-- Laser Top Scanning Line with SMIL -->
    <g transform="translate(48, 48)">
      <line x1="0" y1="0" x2="1104" y2="0" stroke="#1e293b" stroke-width="1"/>
      <rect y="-1" width="220" height="2" fill="url(#hero-laser)">
        <animateTransform attributeName="transform" type="translate" values="-220 0; 1104 0" dur="4.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Center Identity Branding (Exact Image 2 Structure) -->
    <g text-anchor="middle" transform="translate(600, 165)">
      <text y="0" fill="url(#hero-title-grad)" font-size="68" font-weight="900" letter-spacing="18" class="sans" filter="url(#matrix-glow)">AIRA</text>

      <circle cx="0" cy="22" r="5" fill="#e0f2fe">
        <animate attributeName="r" values="4;6;4" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="22" r="10" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5">
        <animate attributeName="r" values="8;16;8" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
      </circle>

      <text y="54" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="5.5" class="mono">FULL-STACK DEVELOPER  ·  SYSTEM BUILDER</text>

      <g transform="translate(0, 92)" class="mono" font-size="10.5" font-weight="700">
        <g transform="translate(-215, 0)">
          <rect x="0" y="-14" width="98" height="28" rx="6" fill="#091224" stroke="#1e3a5f" stroke-width="1.2"/>
          <text x="49" y="4" fill="#bae6fd" letter-spacing="1">NEXT.JS</text>
        </g>

        <g transform="translate(-102, 0)">
          <rect x="0" y="-14" width="98" height="28" rx="6" fill="#0e1329" stroke="#3730a3" stroke-width="1.2"/>
          <text x="49" y="4" fill="#c7d2fe" letter-spacing="1">NESTJS</text>
        </g>

        <g transform="translate(10, 0)">
          <rect x="0" y="-14" width="98" height="28" rx="6" fill="#09152b" stroke="#0369a1" stroke-width="1.2"/>
          <text x="49" y="4" fill="#7dd3fc" letter-spacing="1">DOCKER</text>
        </g>

        <g transform="translate(122, 0)">
          <rect x="0" y="-14" width="98" height="28" rx="6" fill="#13102c" stroke="#4c1d95" stroke-width="1.2"/>
          <text x="49" y="4" fill="#ddd6fe" letter-spacing="1">CI/CD</text>
        </g>
      </g>

      <text y="152" fill="#475569" font-size="9.5" font-weight="600" letter-spacing="4.5" class="mono">
        BUILD  ·  SHIP  ·  AUTOMATE  ·  REPEAT
      </text>
    </g>

    <!-- Bottom Interactive Progress Slider (Matching Image 2) -->
    <g transform="translate(120, 368)">
      <line x1="0" y1="0" x2="960" y2="0" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
      <rect x="0" y="-2" width="130" height="4" rx="2" fill="#22d3ee" filter="url(#matrix-glow)"/>
      <circle cx="130" cy="0" r="3" fill="#ffffff"/>
    </g>

    <!-- Outer Border -->
    <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#hero-border)" stroke-width="1.2"/>
  </g>
</svg>