<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-label="Aira Developer Terminal Diagnostics">
  <defs>
    <linearGradient id="term-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="term-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <filter id="term-glow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <style>
    .term-font { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Window Container -->
  <rect width="1000" height="220" rx="12" fill="url(#term-bg)"/>
  <rect x="1" y="1" width="998" height="218" rx="11" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Window Header Bar -->
  <path d="M 0 12 Q 0 0 12 0 L 988 0 Q 1000 0 1000 12 L 1000 38 L 0 38 Z" fill="url(#term-header)"/>
  <line x1="0" y1="38" x2="1000" y2="38" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Control Buttons -->
  <circle cx="24" cy="19" r="6" fill="#ef4444" opacity="0.85"/>
  <circle cx="44" cy="19" r="6" fill="#f59e0b" opacity="0.85"/>
  <circle cx="64" cy="19" r="6" fill="#10b981" opacity="0.85"/>

  <!-- Window Title -->
  <text x="500" y="23" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1" class="term-font">aira@node-v20: ~/portfolio (zsh)</text>

  <!-- Terminal Content -->
  <g class="term-font" font-size="12.5" transform="translate(28, 62)">
    <!-- Line 1: Command -->
    <text y="0" fill="#38bdf8" font-weight="700">aira@system<tspan fill="#64748b">:</tspan><tspan fill="#a78bfa">~/workspace</tspan><tspan fill="#64748b">$</tspan> <tspan fill="#f1f5f9">aira-cli status --all</tspan></text>

    <!-- Line 2: Identity & Focus -->
    <text y="24" fill="#94a3b8">  [PROFILE]      <tspan fill="#f8fafc" font-weight="700">Aira</tspan> <tspan fill="#64748b">|</tspan> Full-Stack Software Engineer &amp; Architect</text>

    <!-- Line 3: Core Stack -->
    <text y="46" fill="#94a3b8">  [TECH STACK]   <tspan fill="#38bdf8">Next.js</tspan> <tspan fill="#64748b">·</tspan> <tspan fill="#a78bfa">NestJS</tspan> <tspan fill="#64748b">·</tspan> <tspan fill="#34d399">PostgreSQL</tspan> <tspan fill="#64748b">·</tspan> <tspan fill="#f43f5e">Redis</tspan> <tspan fill="#64748b">·</tspan> <tspan fill="#38bdf8">Docker</tspan></text>

    <!-- Line 4: Philosophy -->
    <text y="68" fill="#94a3b8">  [PHILOSOPHY]   <tspan fill="#e2e8f0">Build clean. Ship fast. Automate continuously.</tspan></text>

    <!-- Line 5: System Status -->
    <text y="90" fill="#94a3b8">  [DIAGNOSTICS]  Health: <tspan fill="#34d399" font-weight="700">100% OK</tspan> <tspan fill="#64748b">|</tspan> Pipeline: <tspan fill="#38bdf8" font-weight="700">ACTIVE</tspan> <tspan fill="#64748b">|</tspan> Opportunities: <tspan fill="#34d399" font-weight="700">OPEN</tspan></text>

    <!-- Line 6: Next Command & Blinking Cursor -->
    <g transform="translate(0, 122)">
      <text y="0" fill="#38bdf8" font-weight="700">aira@system<tspan fill="#64748b">:</tspan><tspan fill="#a78bfa">~/workspace</tspan><tspan fill="#64748b">$</tspan> <tspan fill="#f1f5f9">run-portfolio --mode=production</tspan></text>
      <rect x="428" y="-12" width="8" height="15" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>