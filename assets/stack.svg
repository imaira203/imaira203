<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 215" width="100%" height="100%" role="img" aria-label="Technology Stack and Architecture Matrix">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="stk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#070e1a"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="stk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="stk-clip">
      <rect width="1200" height="215" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; }
  </style>

  <g clip-path="url(#stk-clip)">
    <!-- Container Box -->
    <rect width="1200" height="215" fill="url(#stk-bg)"/>
    <rect x="1" y="1" width="1198" height="213" rx="15" fill="none" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Top Left Section Badge: > stack (Matching Image 1) -->
    <g transform="translate(48, 24)">
      <!-- Dark Pill Container -->
      <rect width="112" height="34" rx="6" fill="#090f1d" stroke="#334155" stroke-width="1.2"/>
      <text x="14" y="22" fill="#38bdf8" font-size="16" font-weight="900" class="mono">&gt;</text>
      <text x="32" y="23" fill="#ffffff" font-size="15" font-weight="800" letter-spacing="1.5" class="mono">stack</text>

      <!-- Top Divider Line -->
      <line x1="126" y1="17" x2="1104" y2="17" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- 5 Architecture Cards (Matching Image 1) -->
    <g transform="translate(48, 76)">
      <!-- Card 1: FRONTEND -->
      <g transform="translate(0, 0)">
        <rect width="206" height="78" rx="10" fill="url(#card-bg)" stroke="#1e3a5f" stroke-width="1.2"/>
        <text x="20" y="27" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">FRONTEND</text>
        <text x="20" y="53" fill="#f8fafc" font-size="13" font-weight="600" class="sans">Next.js  <tspan fill="#38bdf8">·</tspan>  React  <tspan fill="#38bdf8">·</tspan>  TS</text>
      </g>

      <!-- Card 2: BACKEND -->
      <g transform="translate(224, 0)">
        <rect width="206" height="78" rx="10" fill="url(#card-bg)" stroke="#312e81" stroke-width="1.2"/>
        <text x="20" y="27" fill="#818cf8" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">BACKEND</text>
        <text x="20" y="53" fill="#f8fafc" font-size="13" font-weight="600" class="sans">NestJS  <tspan fill="#818cf8">·</tspan>  Node  <tspan fill="#818cf8">·</tspan>  API</text>
      </g>

      <!-- Card 3: DATA -->
      <g transform="translate(448, 0)">
        <rect width="206" height="78" rx="10" fill="url(#card-bg)" stroke="#065f46" stroke-width="1.2"/>
        <text x="20" y="27" fill="#34d399" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">DATA</text>
        <text x="20" y="53" fill="#f8fafc" font-size="13" font-weight="600" class="sans">MySQL  <tspan fill="#34d399">·</tspan>  Redis  <tspan fill="#34d399">·</tspan>  Prisma</text>
      </g>

      <!-- Card 4: INFRA -->
      <g transform="translate(672, 0)">
        <rect width="206" height="78" rx="10" fill="url(#card-bg)" stroke="#1e3a5f" stroke-width="1.2"/>
        <text x="20" y="27" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">INFRA</text>
        <text x="20" y="53" fill="#f8fafc" font-size="13" font-weight="600" class="sans">Docker  <tspan fill="#38bdf8">·</tspan>  Nginx  <tspan fill="#38bdf8">·</tspan>  Linux</text>
      </g>

      <!-- Card 5: AUTOMATION -->
      <g transform="translate(896, 0)">
        <rect width="208" height="78" rx="10" fill="url(#card-bg)" stroke="#4c1d95" stroke-width="1.2"/>
        <text x="20" y="27" fill="#c084fc" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">AUTOMATION</text>
        <text x="20" y="53" fill="#f8fafc" font-size="12.5" font-weight="600" class="sans">GitHub Actions  <tspan fill="#c084fc">·</tspan>  CI/CD</text>
      </g>
    </g>

    <!-- Progress Bar Line & 01-05 Steps (Matching Image 1) -->
    <g transform="translate(48, 175)">
      <!-- Base Rail Track -->
      <line x1="20" y1="0" x2="1080" y2="0" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Active Glowing Indicator on 01 (Matching Image 1) -->
      <rect x="75" y="-1.5" width="48" height="3" rx="1.5" fill="#22d3ee" filter="url(#stk-glow)"/>

      <!-- Step Numbers 01 to 05 -->
      <g class="mono" font-size="10" fill="#64748b" font-weight="600">
        <text x="100" y="19" text-anchor="middle" fill="#94a3b8">01</text>
        <text x="325" y="19" text-anchor="middle">02</text>
        <text x="550" y="19" text-anchor="middle">03</text>
        <text x="775" y="19" text-anchor="middle">04</text>
        <text x="1000" y="19" text-anchor="middle">05</text>
      </g>
    </g>
  </g>
</svg>