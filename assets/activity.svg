<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-label="GitHub Activity and Realtime Engineering Metrics">
  <defs>
    <linearGradient id="act-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <linearGradient id="act-pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="act-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0"/>
    </linearGradient>

    <filter id="act-glow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Frame Background -->
  <rect width="1200" height="240" rx="14" fill="url(#act-bg)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Telemetry Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.6">
    <line x1="50" y1="50" x2="1150" y2="50"/>
    <line x1="50" y1="95" x2="1150" y2="95"/>
    <line x1="50" y1="140" x2="1150" y2="140"/>
    <line x1="50" y1="185" x2="1150" y2="185"/>

    <line x1="160" y1="40" x2="160" y2="195"/>
    <line x1="360" y1="40" x2="360" y2="195"/>
    <line x1="560" y1="40" x2="560" y2="195"/>
    <line x1="760" y1="40" x2="760" y2="195"/>
    <line x1="960" y1="40" x2="960" y2="195"/>
  </g>

  <!-- Top Status Bar -->
  <g transform="translate(50, 32)">
    <circle cx="0" cy="0" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="4" fill="#67e8f9" font-size="11" font-weight="700" letter-spacing="1.5" class="mono">CONTRIBUTION STREAM &amp; ACTIVITY FLOW</text>
    <text x="1100" y="4" fill="#64748b" font-size="9.5" text-anchor="end" class="mono">STATUS: HIGH VELOCITY</text>
  </g>

  <!-- Activity Curve Area Fill -->
  <path d="M 50 185 L 50 150 C 140 130 220 160 320 110 C 420 60 510 130 620 90 C 730 50 820 120 930 80 C 1040 40 1100 70 1150 60 L 1150 185 Z" fill="url(#act-fill)"/>

  <!-- Activity Pulse Curve Line -->
  <path d="M 50 150 C 140 130 220 160 320 110 C 420 60 510 130 620 90 C 730 50 820 120 930 80 C 1040 40 1100 70 1150 60" fill="none" stroke="url(#act-pulse)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Travelling Light Node Along the Curve -->
  <circle cx="50" cy="150" r="4.5" fill="#ffffff" filter="url(#act-glow)">
    <animate attributeName="cx" values="50;320;620;930;1150;50" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;110;90;80;60;150" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Data Checkpoints -->
  <g fill="#0b1220" stroke="#38bdf8" stroke-width="2">
    <circle cx="160" cy="138" r="4.5"/>
    <circle cx="360" cy="98" r="4.5"/>
    <circle cx="560" cy="108" r="4.5"/>
    <circle cx="760" cy="68" r="4.5"/>
    <circle cx="960" cy="74" r="4.5"/>
  </g>

  <!-- Activity Summary Chips at Bottom -->
  <g transform="translate(50, 215)" class="mono" font-size="9.5">
    <text x="0" y="0" fill="#94a3b8">CADENCE: <tspan fill="#34d399" font-weight="700">DAILY COMMITS</tspan></text>
    <text x="280" y="0" fill="#94a3b8">MAIN BRANCH: <tspan fill="#38bdf8" font-weight="700">PROTECTED &amp; GREEN</tspan></text>
    <text x="610" y="0" fill="#94a3b8">CODE REVIEWS: <tspan fill="#a78bfa" font-weight="700">RIGOROUS</tspan></text>
    <text x="920" y="0" fill="#94a3b8">TEST SUITE: <tspan fill="#34d399" font-weight="700">PASSING (100%)</tspan></text>
  </g>
</svg>