      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="250" height="38" rx="6" fill="#080f1d"/>
  <rect x="0.5" y="0.5" width="249" height="37" rx="5.5" fill="none" stroke="url(#b-web-border)" stroke-width="1.2"/>
  
  <!-- Left Side: Globe + WEBSITE -->
  <rect x="1" y="1" width="105" height="36" rx="5" fill="#1e293b"/>
