    <line x1="1" y1="8" x2="15" y2="8" stroke="#38bdf8" stroke-width="1.1"/>
    <line x1="2.5" y1="4.5" x2="13.5" y2="4.5" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.7"/>
    <line x1="2.5" y1="11.5" x2="13.5" y2="11.5" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.7"/>
  </g>
  <text x="44" y="23.5" fill="#ffffff" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">WEBSITE</text>

  <!-- Right Side: TXHGAMING.COM -->
  <text x="178" y="23.5" fill="#67e8f9" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">TXHGAMING.COM</text>
