name: Update Contribution Snake & Profile Assets

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC
    - cron: "0 0,12 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG Animation
        uses: Platane/snk@v3
        with:
          github_user_name: imaira203
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#0a101f,#1e293b,#0284c7,#38bdf8,#67e8f9
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit & Push Updated Assets
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "chore(automation): sync contribution snake & telemetry [skip ci]"
          add: "assets/github-contribution-grid-snake*.svg"
